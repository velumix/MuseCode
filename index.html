<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/velum-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Velum Code</title>
    <link rel="stylesheet" href="/src/startup.css" />
    <style>
      html {
        background: #18191b;
      }
    </style>
  </head>

  <body>
    <div id="startup" class="startup" role="status" aria-label="Starting Velum Code">
      <div class="startup-brand">
        <div class="startup-emblem" aria-hidden="true">
          <div class="startup-halo"></div>
          <img class="startup-mark" src="/src/assets/velum-mark.png" width="88" height="88" alt="" draggable="false" />
        </div>
        <div class="startup-wordmark" aria-hidden="true">Velum <span>Code</span></div>
        <div class="startup-caption" aria-hidden="true">Your space to create</div>
        <div id="startup-progress" class="startup-track" role="progressbar" aria-label="Startup update progress" aria-valuemin="0" aria-valuemax="100"><div class="startup-sweep"></div></div>
        <div id="startup-message" class="startup-message">Checking for updates…</div>
        <div id="startup-detail" class="startup-detail"></div>
        <div class="startup-actions"><button id="startup-skip" class="startup-skip" type="button" hidden>Open current version</button></div>
      </div>
    </div>
    <div id="root" inert aria-busy="true"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
