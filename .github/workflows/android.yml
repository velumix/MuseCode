name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-build:
    name: Test and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle
            android/gradle/wrapper/gradle-wrapper.properties
      - name: Install Android SDK packages
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Test, lint, and build APK
        run: ./gradlew --no-daemon --console=plain -I ../scripts/legal-android.gradle :app:legalNotices :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Prepare installable preview
        run: |
          mkdir -p ../artifacts/android-preview/legal
          cp app/build/outputs/apk/debug/app-debug.apk ../artifacts/android-preview/VelumCode-Android-preview.apk
          cp app/src/main/assets/third-party-notices.txt ../artifacts/android-preview/legal/
          cp ../legal/android-dependencies.json ../artifacts/android-preview/legal/
          cp ../LEGAL.md ../TERMS.md ../PRIVACY.md ../SECURITY.md ../artifacts/android-preview/legal/
      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: VelumCode-Android-preview
          path: artifacts/android-preview/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload check reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-check-reports
          path: android/app/build/reports/
          if-no-files-found: ignore
          retention-days: 7
