name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-build:
    name: Test and build Windows installer
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CI: true
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Install test browser
        run: npx playwright install chromium
      - name: Prepare pinned Rust toolchain
        run: rustup toolchain install
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Build frontend and run browser and Rust tests
        run: npm run check
      - name: Check Rust warnings
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - name: Check documentation and dependency notices
        run: |
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml
          npm run legal:notices:check
          npm run legal:check
      - name: Build Windows installer
        run: npx tauri build --bundles nsis --config src-tauri/tauri.preview.conf.json
      - name: Check installer toolchain notices and prepare download
        shell: pwsh
        run: |
          npm run legal:notices:check
          if ($LASTEXITCODE -ne 0) { throw 'Installer toolchain notice review is required.' }
          New-Item -ItemType Directory -Force artifacts/windows/legal | Out-Null
          Copy-Item -Path src-tauri/target/release/bundle/nsis/*-setup.exe -Destination artifacts/windows
          Copy-Item -LiteralPath THIRD_PARTY_NOTICES.txt, LEGAL.md, TERMS.md, PRIVACY.md, SECURITY.md -Destination artifacts/windows/legal
          Copy-Item -LiteralPath legal/dependencies.json, legal/upstream.json -Destination artifacts/windows/legal
          Copy-Item -LiteralPath legal/covered-sources -Destination artifacts/windows/legal -Recurse
          Copy-Item -LiteralPath legal/upstream -Destination artifacts/windows/legal -Recurse
      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: VelumCode-windows-x64
          path: artifacts/windows/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
